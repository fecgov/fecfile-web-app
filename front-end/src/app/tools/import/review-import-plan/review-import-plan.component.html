@if (error(); as message) {
  <p class="text-red-600" role="alert">{{ message }}</p>
} @else if (!importDetail() || parsing()) {
  <p>Preparing your import plan…</p>
} @else {
  <p>Import status: {{ importDetail()?.status }}</p>
}

@if (parsedData(); as parsed) {
  <p-card header="Parsed import data">
    <pre class="parsed-json">{{ parsed | json }}</pre>
  </p-card>
}
