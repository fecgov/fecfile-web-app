<div class="drop-down position-static flex justify-content-center table-action-dropdown">
  <button
    pButton
    pRipple
    [icon]="buttonIcon()"
    [label]="buttonLabel()"
    [class.rounded-text]="rounded()"
    [class]="buttonStyleClass()"
    [ariaLabel]="buttonAriaLabel()"
    [attr.data-cy]="buttonDataCy()"
    (click)="op.toggle($event)"
  ></button>
  <p-popover #op appendTo="target" styleClass="popdown">
    <ul class="dropdown-menu" data-cy="table-actions-popover">
      @for (action of filteredActions(); track action; let index = $index) {
        <li>
          <button
            [disabled]="!action.isEnabled(actionItem())"
            pButton
            pRipple
            type="button"
            class="p-button-secondary p-button-text w-full text-left table-action-button"
            [id]="'button-' + index"
            [attr.data-cy]="actionDataCy(action.label)"
            (click)="performAction(action)"
          >
            {{ action.label }}
          </button>
        </li>
      } @empty {
        <p>Loading...</p>
      }
    </ul>
  </p-popover>
</div>
