<div class="flex">
  <app-contact-search
    [key]="key()"
    [(contactType)]="contactType"
    [contactTypeOptions]="_contactTypeOptions()"
    [excludeIds]="excludeIds()"
    (contactSelect)="contactSelect.emit($event)"
  />
  <div class="add-contact-container">
    or
    <button pButton [text]="true" (click)="open()">
      <img alt="Plus" src="assets/img/i-plus-circle.svg" height="20px" width="20px" />
      <a>Create a new contact</a>
    </button>
  </div>
</div>
