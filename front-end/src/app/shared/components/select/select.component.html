<div class="field">
  <span [class]="labelClass()" [id]="selectId().label">
    {{ label() }}
    @if (!required()) {
      <span class="paren-label">(OPTIONAL)</span>
    }
  </span>
  <p-select
    [inputId]="selectId().id"
    [options]="options()"
    [formControl]="control()"
    [showClear]="showClear()"
    [aria-labelledby]="selectId().label"
    [appendTo]="appendTo()"
    (onChange)="update.emit(control().value)"
    (onBlur)="update.emit(control().value)"
  >
    @if (customTemplate(); as tpl) {
      <ng-template pTemplate="selectedItem" let-selectedOption>
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: selectedOption }" />
      </ng-template>

      <ng-template pTemplate="item" let-option>
        <ng-container *ngTemplateOutlet="tpl; context: { $implicit: option }" />
      </ng-template>
    }
  </p-select>
  @if (includeErrorMessages()) {
    <app-error-messages [form]="form()" [fieldName]="formControlName()" [formSubmitted]="formSubmitted()" />
  }
</div>
