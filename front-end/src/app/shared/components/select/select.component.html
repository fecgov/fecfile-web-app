<div class="field">
  <label [class]="labelClass()" [id]="selectId().label" [for]="selectId().id">
    {{ label() }}
    @if (optionalLabel()) {
      <span class="paren-label">(OPTIONAL)</span>
    }
  </label>
  <p-select
    [id]="selectId().id"
    [options]="options()"
    [formControl]="control()"
    optionLabel="label"
    optionValue="value"
    [showClear]="showClear()"
    (onChange)="handleChange(); update.emit(control().value)"
    (onBlur)="update.emit(control().value)"
  >
    @if (customTemplate()) {
      <ng-template pTemplate="item" let-option>
        <ng-container *ngTemplateOutlet="customTemplate(); context: { $implicit: option }"></ng-container>
      </ng-template>
      <ng-template pTemplate="selectedItem" let-option>
        <ng-container *ngTemplateOutlet="customTemplate(); context: { $implicit: option }"></ng-container>
      </ng-template>
    }
  </p-select>
  @if (includeErrorMessages()) {
    <app-error-messages [form]="form()" [fieldName]="formControlName()" [formSubmitted]="formSubmitted()" />
  }
</div>
