<label [for]="id()">
  {{ label() }}
  @if (optional()) {
    <span class="paren-label">(OPTIONAL)</span>
  }
</label>
<input type="text" pInputText [id]="id()" [formField]="field()" [appToUpper]="forceUpper()" />
@if (fieldState().touched() && fieldState().invalid()) {
  <small class="p-error" role="alert"> {{ fieldState().errors()[0].message }} </small>
}
