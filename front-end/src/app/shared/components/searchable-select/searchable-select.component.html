<p-select
  #pSelect
  [options]="options()"
  [inputId]="inputId()"
  [readonly]="readonly() || disabled"
  [styleClass]="styleClass()"
  [disabled]="disabled"
  [class.p-disabled]="disabled"
  [ngModel]="value"
  (ngModelChange)="change($event)"
  (onBlur)="blur()"
  [pt]="pt()"
  fluid
>
</p-select>
