<div class="flex justify-content-between">
  <div>
    <button
      pButton
      pRipple
      [label]="backLabel()"
      (click)="cancelForm.emit()"
      [class]="includeSave() ? 'p-button-secondary' : 'p-button-primary'"
    ></button>
  </div>
  @if (includeSave()) {
    <div>
      <button
        pButton
        pRipple
        appSingleClick
        label="Save"
        (click)="save.emit()"
        class="p-button-primary"
        [class.p-disabled]="submitDisabled()"
        [disabled]="submitDisabled()"
        data-cy="save-cancel-actions"
      ></button>
      <button
        pButton
        pRipple
        appSingleClick
        label="Save & continue"
        (click)="save.emit('continue')"
        class="p-button-info ml-4"
        [class.p-disabled]="submitDisabled()"
        [disabled]="submitDisabled()"
        data-cy="save-cancel-actions"
      ></button>
    </div>
  }
</div>
