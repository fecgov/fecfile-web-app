<div class="flex justify-content-between">
  <div>
    <button pButton pRipple label="Back" type="button" (click)="cancelForm.emit()" class="p-button-secondary"></button>
  </div>
  <div>
    <button
      pButton
      pRipple
      appSingleClick
      label="Save"
      type="button"
      (click)="save.emit()"
      class="p-button-primary"
      [class.p-disabled]="submitDisabled()"
      [disabled]="submitDisabled()"
      data-cy="save-cancel-actions"
    ></button>
    <button
      pButton
      pRipple
      appSingleClick
      label="Save & continue"
      type="button"
      (click)="save.emit('continue')"
      class="p-button-info ml-4"
      [class.p-disabled]="submitDisabled()"
      [disabled]="submitDisabled()"
      data-cy="save-cancel-actions"
    ></button>
  </div>
</div>
