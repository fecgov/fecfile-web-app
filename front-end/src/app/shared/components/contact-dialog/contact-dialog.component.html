<app-dialog
  tabindex="-1"
  aria-labelledby="dialog-title"
  [title]="contact() ? 'Edit contact' : 'Add contact'"
  [(visible)]="visible"
  [submitDisabled]="form().invalid()"
  (confirm)="submitForm()"
>
  <form novalidate (submit)="$event.preventDefault()" class="grid-form">
    <app-select-input
      label="CONTACT TYPE"
      [formField]="form.type"
      labelId="contact-type-label"
      [options]="availableContactTypes()"
      class="grid-col-12 w-max"
    />
    @if (!form.IND().hidden()) {
      <app-individual-contact-form [fields]="form.IND" />
    }
    @if (!form.CAN().hidden()) {
      <app-candidate-contact-form [fields]="form.CAN" />
    }
    @if (!form.COM().hidden()) {
      <app-committee-contact-form [fields]="form.COM" />
    }
    @if (!form.ORG().hidden()) {
      <app-organization-contact-form [fields]="form.ORG" />
    }

    @if (showHistory() && !isNewItem()) {
      <app-contact-transaction-table [contact]="contact()" />
    }
  </form>
</app-dialog>
