<nav
  class="w-full flex justify-content-between align-items-center py-0"
  aria-label="Navigation Bar"
  [class.compact]="isCompact()"
>
  <img
    ngSrc="assets/img/seal-and-title.svg"
    class="seal-and-title mr-2 navbar-brand pb-0"
    alt="FEC Seal"
    height="48"
    width="227"
    (click)="useDynamicSidebar && toggleSidebar()"
    (keydown.enter)="useDynamicSidebar && toggleSidebar()"
  />

  <div class="collapse navbar-collapse justify-content-end" id="navbarTogglerDemo01">
    @switch (headerStyle()) {
      @case ('DEFAULT') {
        @defer {
          <app-default-header-links />
        }
      }
      @case ('LOGIN') {
        <app-login-header-links />
      }
      @case ('LOGOUT') {
        <app-logout-header-links />
      }
    }
  </div>
</nav>
