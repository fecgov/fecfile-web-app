@if (showBanner()) {
  <section class="environment-banner" [style.backgroundColor]="bannerConfig!.color">
    <div class="content">
      <div class="text">
        <div class="title">
          {{ bannerConfig!.title }}
        </div>

        <div class="subtitle">
          {{ subtitle }}
        </div>
      </div>
    </div>
  </section>
}
