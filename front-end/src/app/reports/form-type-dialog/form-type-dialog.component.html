<app-dialog
  aria-labelledby="dialog-title"
  title="Create a new report"
  submitLabel="Start building report"
  [(visible)]="dialogVisible"
  (confirm)="submitForm()"
  [submitDisabled]="reportForm().invalid()"
>
  <form novalidate (submit)="$event.preventDefault()" class="grid-form">
    <app-select-input
      [options]="filteredOptions()"
      [formField]="reportForm.type"
      labelId="type-dropdown-label"
      labelSyleClass="dialog-label"
    >
      <ng-template #selectedItem let-selectedOption>
        <span class="option">
          <b>{{ selectedLabel() }}:</b> {{ selectedDescription() }}
        </span>
      </ng-template>
      <ng-template #item let-type>
        <span class="option" [attr.data-cy]="type">
          <b>{{ type.label }}:</b> {{ type.description }}
        </span>
      </ng-template>
    </app-select-input>
    @if (!reportForm.f24().hidden()) {
      <app-select-button-input
        [options]="form24Options"
        label="REPORT TYPE"
        labelId="form24-type-label"
        labelStyleClass="dialog-label"
        [formField]="reportForm.f24.type"
      />
      <app-input-group
        [formField]="reportForm.f24.typelessName"
        [pretext]="typeHour()"
        inputId="form24Name"
        labelStyleClass="dialog-label"
      />
    }
  </form>
</app-dialog>
