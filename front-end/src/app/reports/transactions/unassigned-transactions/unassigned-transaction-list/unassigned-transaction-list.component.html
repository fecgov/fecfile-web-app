<div class="transaction-list">
  <p-toolbar class="standard-container">
    <ng-template pTemplate="left">
      <div class="flex flex-column">
        <h1 class="gandhi-bold size-36">Transactions</h1>
      </div>
    </ng-template>
  </p-toolbar>

  <p-tabs value="0" class="pt-5">
    <p-tablist>
      <p-tab value="0" class="karla-bold">Unassigned</p-tab>
    </p-tablist>

    <p-tabpanels>
      <p-tabpanel value="0">
        <p class="gandhi mb-2">
          These transactions do not fall within the coverage dates of any existing report. Transactions unassigned from
          a report will also appear here.
        </p>
        <p class="gandhi mb-0">Memo items are excluded and will not be assigned automatically.</p>
      </p-tabpanel>
    </p-tabpanels>
  </p-tabs>

  <app-transaction-list-table [report]="null" category="receipts" (reloadTables)="refreshTables()" />
  <app-transaction-list-table [report]="null" category="disbursements" (reloadTables)="refreshTables()" />
  <app-transaction-list-table [report]="null" category="loans-and-debts" (reloadTables)="refreshTables()" />
</div>
