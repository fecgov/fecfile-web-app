<div class="components-wrapper">
  @switch (transactionCardinality()) {
    @case (1) {
      <app-transaction-detail [transaction]="transaction()" />
    }
    @case (2) {
      <app-double-transaction-detail [transaction]="transaction()" />
    }
    @case (3) {
      <app-triple-transaction-detail [transaction]="transaction()" />
    }
    @case (-1) {
      <app-reatt-redes-transaction-type-detail [transaction]="transaction()" />
    }
  }

  <app-transaction-children-list-container [transaction]="transaction()" />

  <app-transaction-navigation
    [isEditable]="isEditableReport() && isEditableTransaction()"
    [transaction]="transaction()"
  />
</div>

<app-dialog [(visible)]="showClonedTransactionDialog" title="Cloned transaction">
  <p>
    This is a copy of the previous transaction. Please review the details and make any necessary changes before saving.
  </p>
  <ng-container dialog-footer #dialogFooterRef>
    <div class="flex justify-content-center">
      <button
        type="button"
        pButton
        label="Okay"
        class="p-button-primary"
        (click)="showClonedTransactionDialog.set(false)"
      ></button>
    </div>
  </ng-container>
</app-dialog>
