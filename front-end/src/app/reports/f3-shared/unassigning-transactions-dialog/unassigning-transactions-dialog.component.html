<app-dialog
  [(visible)]="visible"
  header="Can’t save report"
  (reject)="visible.set(false)"
  tabindex="-1"
  aria-labelledby="dialog-title"
>
  <p class="mb-0">
    Some transactions would now fall outside your new coverage dates. To fix this, delete those transactions.
  </p>
  <ng-container dialog-footer #dialogFooterRef>
    <div class="flex justify-content-center">
      <p-button
        type="button"
        label="Manage your transactions"
        class="p-button-primary dialog-button"
        [autofocus]="true"
      ></p-button>
    </div>
  </ng-container>
</app-dialog>
